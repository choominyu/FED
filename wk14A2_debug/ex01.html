<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan-Asian Delights | Food Order</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="ex01.css" rel="stylesheet">
</head>
<body>
    <!-- Data loads first, then script runs -->
    <script src="ex01.js"></script>
    <script src="ex01-data.js"></script>
    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Main Order Card -->
                <div class="card order-card p-4 bg-white">
                    <h2 class="text-center text-danger mb-4">🥢 Pan-Asian Delights</h2>
                    
                    <!-- Meal Choice Dropdown -->
                    <div class="mb-3">
                        <label for="mealSelect" class="form-select fw-bold">Select your meal:</label>
                        <select id="mealSelect" class="form-select">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <!-- Quantity Input -->
                    <div class="mb-3">
                        <label for="QuantityInput" class="form-label fw-bold">Quantity:</label>
                        <input type="number" id="QuantityInput" class="form-control" value="1" min="1" max="20">
                    </div>

                    <!-- Promo Code Dropdown -->
                    <div class="mb-3">
                        <label for="promoSelect" class="form-label fw-bold">Apply Promotion:</label>
                        <select id="promoSelect" class="form-select">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <!-- Calculate Button -->
                    <div class="d-grid gap-2 mb-4">
                        <button id="calculateBtn" class="btn btn-danger btn-lg" type="button">Calculate Total</button>
                    </div>

                    <!-- Output Elements -->
                    <div id="confirmationMessage" class="alert alert-secondary text-center fw-bold fs-6 d-none" role="alert">
                        <!-- Total price breakdowns go here -->
                    </div>

                    <p id="totalDisplay" class="text-success text-center fw-semibold fs-5 mt-2 d-none">
                        <!-- Confirmation message goes here -->
                    </p>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
