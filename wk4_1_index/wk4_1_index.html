<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getting Started with CSS</title>

    <!-- Step 2: Internal CSS (students will edit here later) -->
    <style>
        /* Example rule (students can modify) */
        body {
            font-family: Arial, sans-serif;
        }
    </style>

    <!-- Step 3: External CSS (students will link styles.css later) -->
    <!-- <link rel="stylesheet" href="styles.css"> -->

</head>
<body>
    <link href="style.css" rel="stylesheet"

    <h1>Welcome to My Web Page</h1>

    <h2 >About This Page</h2>
    <p>
        This is a simple HTML page used to learn how CSS works.
        You will apply styles using inline, internal, and external methods.
    </p>

    <h2>My Interests</h2>
    <ul>
        <li>Web Design</li>
        <li>Technology</li>
        <li>Learning New Skills</li>
    </ul>

    <h2>Sample Image</h2>
    <img src="https://via.placeholder.com/300" alt="Sample Image">

    <h2>Useful Link</h2>
    <p>
        Visit <a href="https://www.example.com" target="_blank">Example Website</a>
    </p>

    <!-- Step 1: Inline CSS (students will edit directly in elements) -->
    <!-- Example:
    <h1 style="color: blue;">Welcome to My Web Page</h1>
    -->

</body>
</html>
